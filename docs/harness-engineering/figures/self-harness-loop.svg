<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #1a1a2e; }
      .h { font-size: 15px; font-weight: bold; fill: #1a1a2e; }
      .t { font-size: 12.5px; fill: #333; }
      .small { font-size: 11.5px; fill: #555; }
      .cap { font-size: 12px; font-style: italic; fill: #666; }
      .num { font-size: 13px; font-weight: bold; fill: #5b7fb8; }
    </style>
    <marker id="sh" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#5b7fb8"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#fbfbfd"/>
  <text x="490" y="36" text-anchor="middle" class="title">Self-Harness：提议—评估—接受的自我改进闭环</text>

  <!-- Stage 1 -->
  <g>
    <rect x="60" y="80" width="270" height="180" rx="14" fill="#eef2fb" stroke="#9db4e0" stroke-width="1.5"/>
    <text x="195" y="110" text-anchor="middle" class="h"><tspan class="num">1</tspan> 弱点挖掘</text>
    <text x="195" y="136" text-anchor="middle" class="t">当前 harness 在任务上跑，收集 trace</text>
    <text x="195" y="158" text-anchor="middle" class="t">把失败聚类成「验证器可追溯」的模式</text>
    <rect x="80" y="172" width="230" height="72" rx="8" fill="#ffffff" stroke="#c3d2ec"/>
    <text x="195" y="192" text-anchor="middle" class="small">关键：同一表面错误（超时/缺产物）</text>
    <text x="195" y="210" text-anchor="middle" class="small">可能有不同因果机制，需记录</text>
    <text x="195" y="228" text-anchor="middle" class="small">终末原因 + 行为因果 + 暴露的机制</text>
  </g>

  <!-- Stage 2 -->
  <g>
    <rect x="355" y="80" width="270" height="180" rx="14" fill="#eef9f1" stroke="#93cfae" stroke-width="1.5"/>
    <text x="490" y="110" text-anchor="middle" class="h"><tspan class="num">2</tspan> 提议有界修改</text>
    <text x="490" y="136" text-anchor="middle" class="t">同一模型当「提议者」</text>
    <text x="490" y="158" text-anchor="middle" class="t">针对可解决的复发性错误模式</text>
    <rect x="375" y="172" width="230" height="72" rx="8" fill="#ffffff" stroke="#bfe3cf"/>
    <text x="490" y="192" text-anchor="middle" class="small">输入：可编辑面 + 失败模式 +</text>
    <text x="490" y="210" text-anchor="middle" class="small">要保留的通过行为 + 已试过</text>
    <text x="490" y="228" text-anchor="middle" class="small">的修改摘要（避免重复）</text>
  </g>

  <!-- Stage 3 -->
  <g>
    <rect x="650" y="80" width="270" height="180" rx="14" fill="#fdf1ec" stroke="#ecae8f" stroke-width="1.5"/>
    <text x="785" y="110" text-anchor="middle" class="h"><tspan class="num">3</tspan> 校验并合并</text>
    <text x="785" y="136" text-anchor="middle" class="t">held-in：弱点是否解决？</text>
    <text x="785" y="158" text-anchor="middle" class="t">held-out：是否引入新问题？</text>
    <rect x="670" y="172" width="230" height="72" rx="8" fill="#ffffff" stroke="#f3d3bd"/>
    <text x="785" y="196" text-anchor="middle" class="small">两份回归测试都不退化才接受</text>
    <text x="785" y="216" text-anchor="middle" class="small">被拒的修改只记日志，</text>
    <text x="785" y="234" text-anchor="middle" class="small">不动当前 harness</text>
  </g>

  <!-- arrows -->
  <g stroke="#5b7fb8" stroke-width="2.2" fill="none" marker-end="url(#sh)">
    <line x1="330" y1="170" x2="352" y2="170"/>
    <line x1="625" y1="170" x2="647" y2="170"/>
    <path d="M785 262 C 700 330, 300 330, 195 262" />
  </g>
  <text x="490" y="322" text-anchor="middle" class="small">接受 → h(t+1)，进入下一轮挖掘</text>

  <!-- bottom insight -->
  <rect x="140" y="380" width="700" height="120" rx="12" fill="#f3eefa" stroke="#b6a4dd" stroke-width="1.5"/>
  <text x="490" y="410" text-anchor="middle" class="h">两个值得记住的推论</text>
  <text x="490" y="438" text-anchor="middle" class="t">① 会演化出「模型专属」的 harness —— 不同基座模型，得到不同 harness</text>
  <text x="490" y="462" text-anchor="middle" class="t">② 权限与安全层必须放在这个闭环之外（若程序能改 OS，抽象边界就崩了）</text>
  <text x="490" y="486" text-anchor="middle" class="small">在 Terminal-Bench-2 上为 MiniMax / Qwen3.5 / GLM-5 演示</text>
</svg>
