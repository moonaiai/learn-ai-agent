<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #1a1a2e; }
      .h { font-size: 15px; font-weight: bold; fill: #1a1a2e; }
      .t { font-size: 12.5px; fill: #333; }
      .small { font-size: 11.5px; fill: #555; }
      .gain { font-size: 13px; font-weight: bold; fill: #2e7d5b; }
      .cap { font-size: 12px; font-style: italic; fill: #666; }
    </style>
  </defs>
  <rect width="980" height="470" fill="#fbfbfd"/>
  <text x="490" y="36" text-anchor="middle" class="title">三种「软件工厂」模式：冷静的速度账</text>

  <!-- Option 1 -->
  <g>
    <rect x="60" y="90" width="270" height="240" rx="14" fill="#f6ddd5" stroke="#e0a396" stroke-width="1.5"/>
    <text x="195" y="122" text-anchor="middle" class="h">① 关灯不管</text>
    <text x="195" y="146" text-anchor="middle" class="small">"Turn the lights off"</text>
    <line x1="90" y1="160" x2="300" y2="160" stroke="#e0a396"/>
    <text x="90" y="186" class="t">· 全交给 agent，不 review</text>
    <text x="90" y="210" class="t">· 作者亲测：失败</text>
    <text x="90" y="234" class="t">· 质量失控，返工更高</text>
    <text x="195" y="300" text-anchor="middle" class="gain" fill="#b04a3a">不可持续</text>
  </g>

  <!-- Option 2 -->
  <g>
    <rect x="355" y="90" width="270" height="240" rx="14" fill="#fdf1ec" stroke="#ecae8f" stroke-width="1.5"/>
    <text x="490" y="122" text-anchor="middle" class="h">② 逐行人工 review</text>
    <text x="490" y="146" text-anchor="middle" class="small">review 所有 AI 代码</text>
    <line x1="385" y1="160" x2="595" y2="160" stroke="#f3d3bd"/>
    <text x="385" y="186" class="t">· 速度被拉回人类水平</text>
    <text x="490" y="300" text-anchor="middle" class="gain" fill="#c07a2e">仅 +30–50%</text>
  </g>

  <!-- Option 3 -->
  <g>
    <rect x="650" y="90" width="270" height="240" rx="14" fill="#eef9f1" stroke="#93cfae" stroke-width="2"/>
    <text x="785" y="122" text-anchor="middle" class="h">③ 留人，但只把守高杠杆</text>
    <text x="785" y="146" text-anchor="middle" class="small">"keep people in the loop"</text>
    <line x1="680" y1="160" x2="890" y2="160" stroke="#bfe3cf"/>
    <text x="680" y="186" class="t">· 人只抓设计 / 架构 / 关键决策</text>
    <text x="680" y="210" class="t">· 代码生成交给 agent，不逐行审</text>
    <text x="680" y="234" class="t">· 模型最弱处恰好是人把守处</text>
    <text x="785" y="300" text-anchor="middle" class="gain">≈ 2–3x（不是 10x）</text>
  </g>

  <text x="490" y="392" text-anchor="middle" class="cap">"Find leverage, but keep people in the loop." —— Dex Horthy</text>
  <text x="490" y="420" text-anchor="middle" class="cap">对「10x」「全自动」的克制纠偏：真实可复现的提效是 2–3x，且人必须留在架构与评审环节</text>
</svg>
