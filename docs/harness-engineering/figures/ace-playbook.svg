<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #1a1a2e; }
      .h { font-size: 15px; font-weight: bold; fill: #1a1a2e; }
      .t { font-size: 12.5px; fill: #333; }
      .small { font-size: 11.5px; fill: #555; }
      .code { font-size: 11.5px; fill: #5b3a8a; font-family: "SF Mono", Menlo, monospace; }
      .cap { font-size: 12px; font-style: italic; fill: #666; }
    </style>
    <marker id="ace" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#5b7fb8"/>
    </marker>
  </defs>
  <rect width="980" height="470" fill="#fbfbfd"/>
  <text x="490" y="36" text-anchor="middle" class="title">ACE：把上下文当「演化中的 playbook」，而非越堆越长的提示词</text>

  <!-- Generator -->
  <g>
    <rect x="70" y="90" width="230" height="130" rx="14" fill="#eef2fb" stroke="#9db4e0" stroke-width="1.5"/>
    <text x="185" y="120" text-anchor="middle" class="h">Generator</text>
    <text x="185" y="146" text-anchor="middle" class="t">生成任务轨迹</text>
    <text x="185" y="168" text-anchor="middle" class="small">引用已有的条目 (bullet)</text>
    <text x="185" y="190" text-anchor="middle" class="small">产出成功 / 失败 trace</text>
  </g>

  <!-- Reflector -->
  <g>
    <rect x="375" y="90" width="230" height="130" rx="14" fill="#eef9f1" stroke="#93cfae" stroke-width="1.5"/>
    <text x="490" y="120" text-anchor="middle" class="h">Reflector</text>
    <text x="490" y="146" text-anchor="middle" class="t">从成败轨迹中蒸馏洞见</text>
    <text x="490" y="168" text-anchor="middle" class="small">不只看成功，也看失败</text>
  </g>

  <!-- Curator -->
  <g>
    <rect x="680" y="90" width="230" height="130" rx="14" fill="#fdf1ec" stroke="#ecae8f" stroke-width="1.5"/>
    <text x="795" y="120" text-anchor="middle" class="h">Curator</text>
    <text x="795" y="146" text-anchor="middle" class="t">增量更新结构化上下文</text>
    <text x="795" y="168" text-anchor="middle" class="small">不重写整段 prompt</text>
  </g>

  <!-- flow arrows -->
  <g stroke="#5b7fb8" stroke-width="2.2" fill="none" marker-end="url(#ace)">
    <line x1="300" y1="150" x2="372" y2="150"/>
    <line x1="605" y1="150" x2="677" y2="150"/>
  </g>

  <!-- the key trick box -->
  <rect x="200" y="280" width="580" height="120" rx="12" fill="#ffffff" stroke="#b6a4dd" stroke-width="1.5"/>
  <text x="490" y="308" text-anchor="middle" class="h">关键技巧：确定性合并，而非 LLM 重写</text>
  <text x="490" y="336" text-anchor="middle" class="code">条目 = (identifier, description)</text>
  <text x="490" y="360" text-anchor="middle" class="small">Curator 输出结构化、逐条的 bullet，用确定性逻辑并入「上下文台账」</text>
  <text x="490" y="382" text-anchor="middle" class="small">定期精炼 + 去重 —— 避免 LLM 整段重写自身上下文导致的「坍缩与简洁偏置」</text>

  <!-- feedback loop -->
  <path d="M795 222 C 700 260, 290 260, 190 222" stroke="#5b7fb8" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#ace)"/>
  <text x="490" y="262" text-anchor="middle" class="small">更新后的 playbook 回灌给 Generator</text>

  <text x="490" y="440" text-anchor="middle" class="cap">问题根源：把所有工具响应一股脑塞进上下文，长程任务下必然失控</text>
</svg>
