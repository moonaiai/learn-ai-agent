<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" role="img" aria-label="五种协作拓扑结构示意">
  <title>五种核心协作拓扑</title>
  <style>
    text{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif}
    .ink{fill:#0b0b0b}.ink2{fill:#52514e}.muted{fill:#898781}
    .t{font-size:17px;font-weight:650}
    .s{font-size:13px}
    .n{fill:#ffffff;stroke:#2a78d6;stroke-width:2}
    .e{stroke:#c3c2b7;stroke-width:1.8;fill:none}
    .cell{fill:#ffffff;stroke:#e1e0d9;stroke-width:1}
  </style>
  <rect width="1280" height="620" fill="#fdf5eb"/>

  <!-- 单元 1：Supervisor/Worker -->
  <rect class="cell" x="30" y="40" width="380" height="270" rx="10"/>
  <text class="t ink" x="220" y="72" text-anchor="middle">Supervisor / Worker</text>
  <circle class="n" cx="220" cy="130" r="10"/>
  <circle class="n" cx="100" cy="230" r="10"/>
  <circle class="n" cx="180" cy="230" r="10"/>
  <circle class="n" cx="260" cy="230" r="10"/>
  <circle class="n" cx="340" cy="230" r="10"/>
  <line class="e" x1="213" y1="139" x2="106" y2="221"/>
  <line class="e" x1="215" y1="139" x2="182" y2="220"/>
  <line class="e" x1="225" y1="139" x2="258" y2="220"/>
  <line class="e" x1="227" y1="139" x2="334" y2="221"/>
  <text class="s muted" x="220" y="292" text-anchor="middle">中央协调器 · 控制流可预测 · 协调器是瓶颈</text>

  <!-- 单元 2：Sequential Pipeline -->
  <rect class="cell" x="450" y="40" width="380" height="270" rx="10"/>
  <text class="t ink" x="640" y="72" text-anchor="middle">Sequential Pipeline</text>
  <circle class="n" cx="510" cy="175" r="10"/>
  <circle class="n" cx="597" cy="175" r="10"/>
  <circle class="n" cx="684" cy="175" r="10"/>
  <circle class="n" cx="771" cy="175" r="10"/>
  <line class="e" x1="521" y1="175" x2="584" y2="175"/>
  <line class="e" x1="608" y1="175" x2="671" y2="175"/>
  <line class="e" x1="695" y1="175" x2="758" y2="175"/>
  <text class="s muted" x="640" y="292" text-anchor="middle">固定顺序流转 · 最简单 · 最缺乏灵活性</text>

  <!-- 单元 3：Hierarchical -->
  <rect class="cell" x="870" y="40" width="380" height="270" rx="10"/>
  <text class="t ink" x="1060" y="72" text-anchor="middle">Hierarchical</text>
  <circle class="n" cx="1060" cy="120" r="10"/>
  <circle class="n" cx="970" cy="180" r="10"/>
  <circle class="n" cx="1150" cy="180" r="10"/>
  <circle class="n" cx="920" cy="240" r="10"/>
  <circle class="n" cx="1010" cy="240" r="10"/>
  <circle class="n" cx="1110" cy="240" r="10"/>
  <line class="e" x1="1050" y1="128" x2="980" y2="171"/>
  <line class="e" x1="1070" y1="128" x2="1140" y2="171"/>
  <line class="e" x1="963" y1="189" x2="928" y2="231"/>
  <line class="e" x1="975" y1="188" x2="1007" y2="230"/>
  <line class="e" x1="1143" y1="188" x2="1116" y2="231"/>
  <text class="s muted" x="1060" y="292" text-anchor="middle">多层监督者树 · 高层分解 · 逐层委派</text>

  <!-- 单元 4：Peer-to-Peer -->
  <rect class="cell" x="30" y="330" width="380" height="270" rx="10"/>
  <text class="t ink" x="220" y="362" text-anchor="middle">Peer-to-Peer</text>
  <circle class="n" cx="220" cy="420" r="10"/>
  <circle class="n" cx="120" cy="500" r="10"/>
  <circle class="n" cx="320" cy="500" r="10"/>
  <circle class="n" cx="220" cy="560" r="10"/>
  <line class="e" x1="209" y1="427" x2="131" y2="492"/>
  <line class="e" x1="231" y1="427" x2="309" y2="492"/>
  <line class="e" x1="220" y1="430" x2="220" y2="548"/>
  <line class="e" x1="131" y1="505" x2="209" y2="554"/>
  <line class="e" x1="309" y1="505" x2="231" y2="554"/>
  <line class="e" x1="131" y1="500" x2="309" y2="500"/>
  <text class="s muted" x="220" y="582" text-anchor="middle">平等通信 · 无中央协调 · A2A 面向此模式</text>

  <!-- 单元 5：Event-Driven -->
  <rect class="cell" x="450" y="330" width="380" height="270" rx="10"/>
  <text class="t ink" x="640" y="362" text-anchor="middle">Event-Driven</text>
  <circle class="n" cx="530" cy="420" r="10"/>
  <circle class="n" cx="640" cy="420" r="10"/>
  <circle class="n" cx="750" cy="420" r="10"/>
  <rect x="500" y="480" width="280" height="8" rx="4" fill="#1c5cab"/>
  <line class="e" x1="530" y1="431" x2="545" y2="476"/>
  <line class="e" x1="640" y1="431" x2="640" y2="476"/>
  <line class="e" x1="750" y1="431" x2="735" y2="476"/>
  <circle class="n" cx="560" cy="550" r="10"/>
  <circle class="n" cx="720" cy="550" r="10"/>
  <line class="e" x1="565" y1="488" x2="560" y2="538"/>
  <line class="e" x1="715" y1="488" x2="720" y2="538"/>
  <text class="s muted" x="640" y="582" text-anchor="middle">事件总线解耦 · 发布-订阅响应</text>

  <!-- 单元 6：要点 -->
  <rect class="cell" x="870" y="330" width="380" height="270" rx="10"/>
  <text class="t ink" x="1060" y="380" text-anchor="middle">拓扑即命运</text>
  <text class="s ink2" x="1060" y="425" text-anchor="middle">可靠性不取决于代理数量，</text>
  <text class="s ink2" x="1060" y="450" text-anchor="middle">而取决于代理如何协调</text>
  <text class="s muted" x="1060" y="495" text-anchor="middle">自适应拓扑比固定最优拓扑</text>
  <text class="t" x="1060" y="530" text-anchor="middle" fill="#1c5cab">提升 22.9%</text>
  <text class="s muted" x="1060" y="565" text-anchor="middle">"Bag of Agents" 堆砌放大错误 17 倍</text>
</svg>
